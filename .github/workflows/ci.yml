name: Build and Test

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: windows-latest
    env:
      PYTHONIOENCODING: utf-8

    steps:
    - uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 8.0.x

    - name: Setup Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: '3.11' 

    - name: Install uv
      uses: astral-sh/setup-uv@v5
      with:
        enable-cache: true
        cache-dependency-glob: "**/pyproject.toml"

    - name: Install Windows App SDK Runtime 1.8
      shell: pwsh
      run: |
        Write-Host "Installing Windows App SDK Runtime 1.8..."
        $packageName = "Microsoft.WindowsAppRuntime.1.8"
        
        # Download and install the Windows App SDK Runtime
        $installerUrl = "https://aka.ms/windowsappsdk/1.8/latest/windowsappruntimeinstall-x64.exe"
        $installerPath = "$env:TEMP\windowsappruntimeinstall.exe"
        
        Write-Host "Downloading from $installerUrl..."
        Invoke-WebRequest -Uri $installerUrl -OutFile $installerPath
        
        Write-Host "Installing Windows App SDK Runtime..."
        Start-Process -FilePath $installerPath -ArgumentList "--quiet" -Wait -NoNewWindow
        
        Write-Host "Verifying installation..."
        $installed = Get-AppxPackage -Name "*WindowsAppRuntime*" | Where-Object { $_.Version -like "1.8.*" }
        if ($installed) {
          Write-Host "✓ Windows App SDK Runtime 1.8 installed successfully"
          Write-Host "  Version: $($installed.Version)"
          Write-Host "  Architecture: $($installed.Architecture)"
        } else {
          Write-Warning "Installation completed but package verification failed"
        }

    - name: Restore and Build Build Tasks
      run: |
        dotnet restore PyWinAppSDK.Build.Tasks/PyWinAppSDK.Build.Tasks.csproj
        dotnet build PyWinAppSDK.Build.Tasks/PyWinAppSDK.Build.Tasks.csproj -c Release --no-restore

    - name: Restore Headers and Component Packages
      run: |
        dotnet restore Headers/Headers.proj
        dotnet restore FullBuild/FullBuild.proj

    - name: Run Rebuild and Test Script
      shell: pwsh
      run: .\rebuild_and_test.ps1

    - name: Test Minimal Integration
      shell: pwsh
      working-directory: test
      run: |
        uv sync
        uv run python test_minimal.py

    - name: Upload Wheels
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: wheels
        path: wheels/*.whl
        retention-days: 5

    - name: Upload NuGet Packages
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: localpackages
        path: localpackages/*.nupkg
        retention-days: 5
