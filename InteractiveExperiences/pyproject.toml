[build-system]
requires = [
    "setuptools>=78", 
    "winrt-sdk",
    "winappsdk-headers",
]
build-backend = "setuptools.build_meta"

[project]
name = "winappsdk-InteractiveExperiences"
dynamic = ["version"]
description = "Python projection of Windows Runtime (WinRT) APIs - InteractiveExperiences Package"
readme = "README.md"
license = {text = "MIT"}
classifiers = [
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: Implementation :: CPython",
    "Intended Audience :: Developers",
]
requires-python = ">=3.9"
dependencies = [
    "winrt-runtime",
    "winrt-Windows.Foundation",
    "winrt-Windows.Foundation.Collections",
]

[project.urls]
Documentation = "https://pywinrt.readthedocs.io"
Repository = "https://github.com/pywinrt/pywinrt"
Changelog = "https://github.com/pywinrt/pywinrt/blob/main/CHANGELOG.md"

[tool.setuptools.packages.find]
where = ["."]
# Include both component-specific packages and winappsdk namespace packages
include = [
    "winappsdk_InteractiveExperiences",
    "winappsdk_InteractiveExperiences.*",
    "winappsdk",
    "winappsdk.*",
]

[tool.setuptools.package-data]
"*" = ["*.pyi", "py.typed"]

[tool.setuptools.dynamic]
version = {file = "version.txt"}

[tool.uv]
find-links = ["../../../wheels"]

[tool.cibuildwheel]
before-build = "uv pip install setuptools"
skip = "pp*"
test-skip = "*-win_arm64"

[tool.cibuildwheel.windows]
archs = ["x86", "AMD64", "ARM64"]
